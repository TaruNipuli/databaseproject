
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Store Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
            color: #222;
        }

        h1 {
            color: #333;
        }

        #search,
        #category,
        #customerId {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 12px 0 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px #ddd;
        }

        .price {
            font-size: 1.3em;
            font-weight: bold;
            color: #287a45;
        }

        .quantity {
            width: 80px;
            padding: 8px;
            margin-right: 8px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background-color: #287a45;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e5d34;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #message,
        #orderMessage {
            margin: 20px 0;
        }
    </style>
</head>
<body>

<h1>Online Store</h1>
<p>Browse our products and place an order.</p>

<!-- Customer ID used for the order -->
<label for="customerId">Customer ID</label>
<input
        type="number"
        id="customerId"
        min="1"
        value="1"
        placeholder="Enter customer ID"
>

<!-- Search field for filtering products by name -->
<input
        type="text"
        id="search"
        placeholder="Search products by name..."
>

<!-- Dropdown for filtering products by category -->
<select id="category">
    <option value="">All categories</option>
</select>

<p id="message">Loading products...</p>
<p id="orderMessage" role="status"></p>
<div id="products"></div>

<script>
    // Stores all products fetched from the API
    let allProducts = [];

    // Translates Finnish category names into English
    const categoryTranslations = {
        "Elektroniikka": "Electronics",
        "Kodin tarvikkeet": "Home & Household",
        "Vaatteet": "Clothing",
        "Elintarvikkeet": "Groceries",
        "Työkalut": "Tools",
        "Puhelimet & lisävarusteet": "Phones & Accessories",
        "Huonekalut": "Furniture",
        "Puutarha & piha": "Garden & Outdoor",
        "Kirjat & toimisto": "Books & Office",
        "Urheilu & vapaa-aika": "Sports & Leisure",
        "Lemmikit": "Pets"
    };

    // Fetches products from the Spring Boot REST API
    async function loadProducts() {
        const message = document.getElementById("message");

        try {
            const response = await fetch("/products");

            if (!response.ok) {
                throw new Error("Failed to fetch products.");
            }

            // Save the fetched products
            allProducts = await response.json();

            // Populate the category dropdown
            loadCategories();

            // Display the products
            filterProducts();
        } catch (error) {
            message.textContent =
                "Failed to load products. Please check that the server is running.";
            console.error(error);
        }
    }

    // Populates the dropdown with categories found in the products
    function loadCategories() {
        const categorySelect = document.getElementById("category");

        // Get unique category names and sort them alphabetically
        const categories = [...new Set(
            allProducts
                .map(product => product.category)
                .filter(category => category != null)
                .map(category => category.name)
        )].sort();

        // Add each category to the dropdown in English
        categories.forEach(category => {
            const option = document.createElement("option");

            // Keep the Finnish name as the value for filtering
            option.value = category;

            // Display the English translation
            option.textContent = categoryTranslations[category] || category;

            categorySelect.appendChild(option);
        });
    }

    // Filters products by name and selected category
    function filterProducts() {
        const search = document.getElementById("search")
            .value.toLowerCase().trim();

        // Get the selected category
        const selectedCategory = document.getElementById("category").value;

        // A product must match both filters when they are selected
        const filteredProducts = allProducts.filter(product => {
            const matchesName = product.name.toLowerCase().includes(search);
            const matchesCategory = selectedCategory === ""
                || product.category?.name === selectedCategory;

            return matchesName && matchesCategory;
        });

        // Display only the products that match the filters
        displayProducts(filteredProducts);
    }

    // Displays the given products as cards
    function displayProducts(products) {
        const message = document.getElementById("message");
        const productsDiv = document.getElementById("products");

        // Clear the previous results before displaying new ones
        productsDiv.replaceChildren();

        // Show the number of matches or a message if none are found
        message.textContent = products.length === 0
            ? "No products found."
            : products.length + " product(s) found.";

        products.forEach(product => {
            const card = document.createElement("div");
            card.className = "product";

            const name = document.createElement("h2");
            name.textContent = product.name;

            // Display the product category in English
            const category = document.createElement("p");
            const categoryName = product.category?.name || "";
            category.textContent =
                categoryTranslations[categoryName] || categoryName;

            const description = document.createElement("p");
            description.textContent = product.description || "";

            const price = document.createElement("p");
            price.className = "price";
            price.textContent = Number(product.price).toLocaleString("en-IE", {
                style: "currency",
                currency: "EUR"
            });

            const stock = document.createElement("p");
            stock.textContent =
                "In stock: " + product.stock_quantity + " units";

            // Adds a quantity field for ordering this product
            const quantityLabel = document.createElement("label");
            quantityLabel.textContent = "Quantity: ";

            const quantity = document.createElement("input");
            quantity.type = "number";
            quantity.className = "quantity";
            quantity.min = "1";
            quantity.max = product.stock_quantity;
            quantity.value = "1";
            quantity.setAttribute("aria-label", "Quantity for " + product.name);
            quantity.disabled = product.stock_quantity <= 0;

            // Adds a button for placing an order
            const orderButton = document.createElement("button");
            orderButton.textContent = "Place order";
            orderButton.disabled = product.stock_quantity <= 0;

            orderButton.addEventListener("click", () => {
                createOrder(product, quantity, orderButton);
            });

            // Add product details and order controls to the card
            quantityLabel.appendChild(quantity);
            card.append(
                name,
                category,
                description,
                price,
                stock,
                quantityLabel,
                orderButton
            );

            productsDiv.appendChild(card);
        });
    }

    // Sends an order to the Spring Boot REST API
    async function createOrder(product, quantityInput, orderButton) {
        const customerId = Number(document.getElementById("customerId").value);
        const quantity = Number(quantityInput.value);
        const orderMessage = document.getElementById("orderMessage");

        // Checks the customer ID
        if (!Number.isInteger(customerId) || customerId <= 0) {
            orderMessage.textContent = "Enter a valid customer ID.";
            return;
        }

        // Checks the quantity
        if (!Number.isInteger(quantity)
            || quantity <= 0
            || quantity > product.stock_quantity) {
            orderMessage.textContent =
                "Enter a valid quantity within the available stock.";
            return;
        }

        // Prevents repeated clicks while the request is being processed
        orderButton.disabled = true;
        orderMessage.textContent = "Placing order...";

        try {
            const response = await fetch("/orders", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    customerId: customerId,
                    items: [{
                        productId: product.id,
                        quantity: quantity
                    }]
                })
            });

            if (!response.ok) {
                throw new Error("Order failed. HTTP status: " + response.status);
            }

            const order = await response.json();

            // Shows the order number returned by the server
            orderMessage.textContent =
                "Order placed successfully. Order ID: " + order.id;

            // Reloads products to show the updated stock
            await loadProducts();
        } catch (error) {
            orderMessage.textContent =
                "Could not place the order. Check the customer ID and try again.";
            console.error(error);
        } finally {
            orderButton.disabled = false;
        }
    }

    // Update the results whenever the search field changes
    document.getElementById("search")
        .addEventListener("input", filterProducts);

    // Update the results whenever the category changes
    document.getElementById("category")
        .addEventListener("change", filterProducts);

    // Load products when the page opens
    loadProducts();
</script>

</body>
</html>
